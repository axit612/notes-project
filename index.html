<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota - Modern Notes App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #f8f9fa;
            --text-color: #333333;
            --accent-color: #6c63ff;
            --card-color: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --tag-color: #f0f2ff;
            --tag-text: #6c63ff;
            --search-bg: #f1f3f4;
            --border-radius: 16px;
            --transition: all 0.3s ease;
            --gradient-start: #f8f9fa;
            --gradient-end: #e9ecef;
        }

        .dark-mode {
            --primary-color: #1a1d28;
            --secondary-color: #252836;
            --text-color: #e8eaed;
            --accent-color: #8b85ff;
            --card-color: #252836;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --tag-color: #41331c;
            --tag-text: #fdd663;
            --search-bg: #2d303e;
            --gradient-start: #1a1d28;
            --gradient-end: #0f111a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            color: var(--text-color);
            transition: var(--transition);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(108, 99, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(108, 99, 255, 0.05) 0%, transparent 20%);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 10px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .logo i {
            font-size: 28px;
        }

        .search-bar {
            flex: 1;
            max-width: 600px;
            margin: 0 20px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border-radius: 24px;
            border: none;
            background-color: var(--search-bg);
            color: var(--text-color);
            font-size: 16px;
            transition: var(--transition);
            box-shadow: 0 2px 10px var(--shadow-color);
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-color);
        }

        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #5f6368;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
            transition: var(--transition);
            padding: 10px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .theme-toggle:hover {
            transform: rotate(15deg);
            background-color: var(--accent-color);
            color: white;
        }

        .add-note-btn {
            background: linear-gradient(135deg, var(--accent-color) 0%, #8b85ff 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3);
        }

        .add-note-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(108, 99, 255, 0.4);
        }

        .categories-section {
            margin-bottom: 30px;
        }

        .categories-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .categories-title {
            font-size: 18px;
            font-weight: 600;
        }

        .manage-categories-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            padding: 8px 12px;
            border-radius: 8px;
        }

        .manage-categories-btn:hover {
            background-color: var(--secondary-color);
        }

        .categories {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .category-tag {
            background-color: var(--tag-color);
            color: var(--tag-text);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            box-shadow: 0 2px 5px var(--shadow-color);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-tag.active {
            background: linear-gradient(135deg, var(--accent-color) 0%, #8b85ff 100%);
            color: white;
        }

        .category-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .category-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: var(--transition);
        }

        .category-tag:hover .category-actions {
            opacity: 1;
        }

        .category-action {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 12px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .category-action:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .notes-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .notes-count {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.7;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .note-card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: 22px;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .note-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px var(--shadow-color);
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-color) 0%, #8b85ff 100%);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .note-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .note-content {
            font-size: 14px;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 15px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            color: var(--text-color);
            opacity: 0.9;
        }

        .note-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .note-tag {
            background-color: var(--tag-color);
            color: var(--tag-text);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .note-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 15px;
            opacity: 0;
            transition: var(--transition);
        }

        .note-card:hover .note-actions {
            opacity: 1;
        }

        .note-action {
            background: var(--secondary-color);
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            padding: 8px;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .note-action:hover {
            background-color: var(--accent-color);
            color: white;
            transform: scale(1.1);
        }

        .note-date {
            font-size: 12px;
            color: #9aa0a6;
            margin-top: 10px;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 600px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-color) 0%, #8b85ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
            transition: var(--transition);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-modal:hover {
            background-color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--secondary-color);
            background-color: var(--primary-color);
            color: var(--text-color);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .select-control {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--secondary-color);
            background-color: var(--primary-color);
            color: var(--text-color);
            font-size: 16px;
            transition: var(--transition);
        }

        .select-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.2);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color) 0%, #8b85ff 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.3);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: var(--text-color);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--shadow-color);
        }

        /* Categories management modal */
        .categories-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            border: 1px solid var(--secondary-color);
            border-radius: 10px;
            padding: 10px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--secondary-color);
        }

        .category-item:last-child {
            border-bottom: none;
        }

        .category-item-actions {
            display: flex;
            gap: 10px;
        }

        .category-item-action {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
            transition: var(--transition);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .category-item-action.edit:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .category-item-action.delete:hover {
            background-color: #ff6b6b;
            color: white;
        }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-color);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
            color: var(--accent-color);
        }

        .empty-state h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 16px;
            opacity: 0.7;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .search-bar {
                margin: 10px 0;
                max-width: 100%;
            }

            .notes-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .notes-grid {
                grid-template-columns: 1fr;
            }

            .categories {
                justify-content: flex-start;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-sticky-note"></i>
                <span>Nota</span>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search notes...">
            </div>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <div class="categories-section">
            <div class="categories-header">
                <div class="categories-title">Categories</div>
                <button class="manage-categories-btn" id="manageCategoriesBtn">
                    <i class="fas fa-cog"></i>
                    Manage Categories
                </button>
            </div>
            <div class="categories" id="categoriesContainer">
                <!-- Categories will be dynamically added here -->
            </div>
        </div>

        <div class="notes-actions">
            <button class="add-note-btn" id="addNoteBtn">
                <i class="fas fa-plus"></i>
                Add Note
            </button>
            <div class="notes-count" id="notesCount">6 notes</div>
        </div>

        <div class="notes-grid" id="notesGrid">
            <!-- Notes will be dynamically added here -->
        </div>
    </div>

    <!-- Add/Edit Note Modal -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Note</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="noteForm">
                <div class="form-group">
                    <label for="noteTitle">Title</label>
                    <input type="text" id="noteTitle" class="form-control" placeholder="Note title">
                </div>
                <div class="form-group">
                    <label for="noteContent">Content</label>
                    <textarea id="noteContent" class="form-control" rows="6" placeholder="Write your note here..."></textarea>
                </div>
                <div class="form-group">
                    <label for="noteCategory">Category</label>
                    <select id="noteCategory" class="select-control">
                        <!-- Categories will be dynamically added here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="noteTags">Tags (comma separated)</label>
                    <input type="text" id="noteTags" class="form-control" placeholder="work, ideas, important">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Note</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manage Categories Modal -->
    <div class="modal" id="categoriesModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Manage Categories</h2>
                <button class="close-modal" id="closeCategoriesModal">&times;</button>
            </div>
            <div class="form-group">
                <label for="newCategoryName">Add New Category</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="newCategoryName" class="form-control" placeholder="Category name">
                    <button class="btn btn-primary" id="addCategoryBtn">Add</button>
                </div>
            </div>
            <div class="categories-list" id="categoriesList">
                <!-- Categories list will be dynamically added here -->
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="closeCategoriesBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div class="modal" id="editCategoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Category</h2>
                <button class="close-modal" id="closeEditCategoryModal">&times;</button>
            </div>
            <div class="form-group">
                <label for="editCategoryName">Category Name</label>
                <input type="text" id="editCategoryName" class="form-control" placeholder="Category name">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancelEditCategoryBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveCategoryBtn">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Sample notes data
        let notes = [
            {
                id: 1,
                title: "Meeting Notes",
                content: "Discuss project timeline and deliverables with the team. Follow up on design assets.",
                category: "work",
                tags: ["meeting"],
                date: "2023-05-15"
            },
            {
                id: 2,
                title: "Shopping List",
                content: "Milk, Eggs, Bread, Fruits, Vegetables, Coffee",
                category: "personal",
                tags: ["shopping"],
                date: "2023-05-14"
            },
            {
                id: 3,
                title: "Book Recommendations",
                content: "1. Atomic Habits\n2. Deep Work\n3. The Psychology of Money\n4. Sapiens",
                category: "ideas",
                tags: ["reading"],
                date: "2023-05-12"
            },
            {
                id: 4,
                title: "Project Ideas",
                content: "Create a mobile app for habit tracking with social features and progress visualization.",
                category: "projects",
                tags: ["ideas"],
                date: "2023-05-10"
            },
            {
                id: 5,
                title: "Weekend Plans",
                content: "Saturday: Hiking trip with friends\nSunday: Family dinner and movie night",
                category: "personal",
                tags: [],
                date: "2023-05-08"
            },
            {
                id: 6,
                title: "Learning Goals",
                content: "Complete React course\nPractice algorithms daily\nLearn about UX design principles",
                category: "work",
                tags: ["learning"],
                date: "2023-05-05"
            }
        ];

        // Categories data
        let categories = [
            { id: "all", name: "All Notes" },
            { id: "work", name: "Work" },
            { id: "personal", name: "Personal" },
            { id: "ideas", name: "Ideas" },
            { id: "projects", name: "Projects" },
            { id: "to-do", name: "To-Do" }
        ];

        // DOM Elements
        const notesGrid = document.getElementById('notesGrid');
        const addNoteBtn = document.getElementById('addNoteBtn');
        const noteModal = document.getElementById('noteModal');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const noteForm = document.getElementById('noteForm');
        const modalTitle = document.getElementById('modalTitle');
        const themeToggle = document.getElementById('themeToggle');
        const searchInput = document.querySelector('.search-bar input');
        const notesCount = document.getElementById('notesCount');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const noteCategorySelect = document.getElementById('noteCategory');
        const manageCategoriesBtn = document.getElementById('manageCategoriesBtn');
        const categoriesModal = document.getElementById('categoriesModal');
        const closeCategoriesModal = document.getElementById('closeCategoriesModal');
        const closeCategoriesBtn = document.getElementById('closeCategoriesBtn');
        const categoriesList = document.getElementById('categoriesList');
        const newCategoryName = document.getElementById('newCategoryName');
        const addCategoryBtn = document.getElementById('addCategoryBtn');
        const editCategoryModal = document.getElementById('editCategoryModal');
        const closeEditCategoryModal = document.getElementById('closeEditCategoryModal');
        const cancelEditCategoryBtn = document.getElementById('cancelEditCategoryBtn');
        const editCategoryName = document.getElementById('editCategoryName');
        const saveCategoryBtn = document.getElementById('saveCategoryBtn');

        // Current state
        let isEditing = false;
        let currentNoteId = null;
        let currentFilter = 'all';
        let currentSearch = '';
        let editingCategoryId = null;

        // Initialize the app
        function init() {
            renderCategories();
            renderNotes();
            setupEventListeners();
            updateNotesCount();
        }

        // Render categories
        function renderCategories() {
            categoriesContainer.innerHTML = '';
            
            categories.forEach(category => {
                const categoryTag = document.createElement('div');
                categoryTag.className = `category-tag ${currentFilter === category.id ? 'active' : ''}`;
                categoryTag.setAttribute('data-id', category.id);
                categoryTag.innerHTML = `
                    <span>${category.name}</span>
                    ${category.id !== 'all' ? `
                        <div class="category-actions">
                            <button class="category-action edit-category" data-id="${category.id}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="category-action delete-category" data-id="${category.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    ` : ''}
                `;
                categoriesContainer.appendChild(categoryTag);
            });
            
            // Add event listeners to category tags
            document.querySelectorAll('.category-tag').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    if (!e.target.closest('.category-action')) {
                        const categoryId = tag.getAttribute('data-id');
                        setActiveCategory(categoryId);
                    }
                });
            });
            
            // Add event listeners to category actions
            document.querySelectorAll('.edit-category').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const categoryId = btn.getAttribute('data-id');
                    openEditCategoryModal(categoryId);
                });
            });
            
            document.querySelectorAll('.delete-category').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const categoryId = btn.getAttribute('data-id');
                    deleteCategory(categoryId);
                });
            });
            
            // Update category select in note modal
            updateCategorySelect();
        }

        // Update category select in note modal
        function updateCategorySelect() {
            noteCategorySelect.innerHTML = '';
            
            categories.forEach(category => {
                if (category.id !== 'all') {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    noteCategorySelect.appendChild(option);
                }
            });
        }

        // Set active category
        function setActiveCategory(categoryId) {
            currentFilter = categoryId;
            document.querySelectorAll('.category-tag').forEach(tag => {
                tag.classList.remove('active');
            });
            document.querySelector(`.category-tag[data-id="${categoryId}"]`).classList.add('active');
            renderNotes();
        }

        // Render categories list in management modal
        function renderCategoriesList() {
            categoriesList.innerHTML = '';
            
            categories.forEach(category => {
                if (category.id !== 'all') {
                    const categoryItem = document.createElement('div');
                    categoryItem.className = 'category-item';
                    categoryItem.innerHTML = `
                        <span>${category.name}</span>
                        <div class="category-item-actions">
                            <button class="category-item-action edit" data-id="${category.id}">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="category-item-action delete" data-id="${category.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    categoriesList.appendChild(categoryItem);
                }
            });
            
            // Add event listeners to category item actions
            document.querySelectorAll('.category-item-action.edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const categoryId = btn.getAttribute('data-id');
                    openEditCategoryModal(categoryId);
                });
            });
            
            document.querySelectorAll('.category-item-action.delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    const categoryId = btn.getAttribute('data-id');
                    deleteCategory(categoryId);
                });
            });
        }

        // Add new category
        function addCategory() {
            const name = newCategoryName.value.trim();
            
            if (!name) {
                alert('Please enter a category name');
                return;
            }
            
            const id = name.toLowerCase().replace(/\s+/g, '-');
            
            // Check if category already exists
            if (categories.some(cat => cat.id === id)) {
                alert('Category already exists');
                return;
            }
            
            categories.push({ id, name });
            newCategoryName.value = '';
            renderCategories();
            renderCategoriesList();
            updateCategorySelect();
        }

        // Open edit category modal
        function openEditCategoryModal(categoryId) {
            const category = categories.find(cat => cat.id === categoryId);
            if (!category) return;
            
            editingCategoryId = categoryId;
            editCategoryName.value = category.name;
            categoriesModal.style.display = 'none';
            editCategoryModal.style.display = 'flex';
        }

        // Save category changes
        function saveCategory() {
            const name = editCategoryName.value.trim();
            
            if (!name) {
                alert('Please enter a category name');
                return;
            }
            
            const categoryIndex = categories.findIndex(cat => cat.id === editingCategoryId);
            if (categoryIndex !== -1) {
                categories[categoryIndex].name = name;
            }
            
            editCategoryModal.style.display = 'none';
            categoriesModal.style.display = 'flex';
            renderCategories();
            renderCategoriesList();
            updateCategorySelect();
            
            // Update notes with the old category to use the new category
            notes.forEach(note => {
                if (note.category === editingCategoryId) {
                    note.category = categories[categoryIndex].id;
                }
            });
            
            renderNotes();
        }

        // Delete category
        function deleteCategory(categoryId) {
            if (categoryId === 'all') return;
            
            // Check if any notes use this category
            const notesWithCategory = notes.filter(note => note.category === categoryId);
            
            if (notesWithCategory.length > 0) {
                if (!confirm(`This category has ${notesWithCategory.length} note(s). Deleting it will move these notes to "All Notes". Continue?`)) {
                    return;
                }
                
                // Move notes to default category
                notes.forEach(note => {
                    if (note.category === categoryId) {
                        note.category = 'all';
                    }
                });
            } else {
                if (!confirm('Are you sure you want to delete this category?')) {
                    return;
                }
            }
            
            // Remove category
            categories = categories.filter(cat => cat.id !== categoryId);
            
            // If the deleted category was active, switch to "All Notes"
            if (currentFilter === categoryId) {
                setActiveCategory('all');
            }
            
            renderCategories();
            renderCategoriesList();
            updateCategorySelect();
            renderNotes();
        }

        // Render notes to the grid
        function renderNotes() {
            notesGrid.innerHTML = '';
            
            const filteredNotes = notes.filter(note => {
                const matchesSearch = currentSearch === '' || 
                    note.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                    note.content.toLowerCase().includes(currentSearch.toLowerCase());
                
                const matchesFilter = currentFilter === 'all' || 
                    note.category === currentFilter;
                
                return matchesSearch && matchesFilter;
            });
            
            if (filteredNotes.length === 0) {
                notesGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sticky-note"></i>
                        <h3>No notes found</h3>
                        <p>Try changing your search or create a new note.</p>
                    </div>
                `;
                return;
            }
            
            filteredNotes.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = 'note-card';
                noteCard.innerHTML = `
                    <div class="note-title">${note.title}</div>
                    <div class="note-content">${note.content}</div>
                    <div class="note-tags">
                        ${note.tags.map(tag => `<span class="note-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="note-date">${formatDate(note.date)}</div>
                    <div class="note-actions">
                        <button class="note-action edit-note" data-id="${note.id}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="note-action delete-note" data-id="${note.id}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                notesGrid.appendChild(noteCard);
            });
            
            // Add event listeners to note action buttons
            document.querySelectorAll('.edit-note').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const noteId = parseInt(btn.getAttribute('data-id'));
                    openEditModal(noteId);
                });
            });
            
            document.querySelectorAll('.delete-note').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const noteId = parseInt(btn.getAttribute('data-id'));
                    deleteNote(noteId);
                });
            });
            
            // Add click event to note cards for viewing
            document.querySelectorAll('.note-card').forEach(card => {
                card.addEventListener('click', () => {
                    const noteId = parseInt(card.querySelector('.edit-note').getAttribute('data-id'));
                    openEditModal(noteId);
                });
            });
            
            updateNotesCount();
        }

        // Update notes count
        function updateNotesCount() {
            const filteredNotes = notes.filter(note => {
                const matchesSearch = currentSearch === '' || 
                    note.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                    note.content.toLowerCase().includes(currentSearch.toLowerCase());
                
                const matchesFilter = currentFilter === 'all' || 
                    note.category === currentFilter;
                
                return matchesSearch && matchesFilter;
            });
            
            const count = filteredNotes.length;
            notesCount.textContent = `${count} note${count !== 1 ? 's' : ''}`;
        }

        // Format date for display
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Modal controls
            addNoteBtn.addEventListener('click', openAddModal);
            closeModal.addEventListener('click', closeNoteModal);
            cancelBtn.addEventListener('click', closeNoteModal);
            
            // Form submission
            noteForm.addEventListener('submit', handleFormSubmit);
            
            // Theme toggle
            themeToggle.addEventListener('click', toggleTheme);
            
            // Search functionality
            searchInput.addEventListener('input', handleSearch);
            
            // Categories management
            manageCategoriesBtn.addEventListener('click', () => {
                categoriesModal.style.display = 'flex';
                renderCategoriesList();
            });
            
            closeCategoriesModal.addEventListener('click', () => {
                categoriesModal.style.display = 'none';
            });
            
            closeCategoriesBtn.addEventListener('click', () => {
                categoriesModal.style.display = 'none';
            });
            
            addCategoryBtn.addEventListener('click', addCategory);
            
            newCategoryName.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addCategory();
                }
            });
            
            closeEditCategoryModal.addEventListener('click', () => {
                editCategoryModal.style.display = 'none';
                categoriesModal.style.display = 'flex';
            });
            
            cancelEditCategoryBtn.addEventListener('click', () => {
                editCategoryModal.style.display = 'none';
                categoriesModal.style.display = 'flex';
            });
            
            saveCategoryBtn.addEventListener('click', saveCategory);
            
            // Close modal when clicking outside
            window.addEventListener('click', (e) => {
                if (e.target === noteModal) {
                    closeNoteModal();
                }
                if (e.target === categoriesModal) {
                    categoriesModal.style.display = 'none';
                }
                if (e.target === editCategoryModal) {
                    editCategoryModal.style.display = 'none';
                    categoriesModal.style.display = 'flex';
                }
            });
        }

        // Open modal for adding a new note
        function openAddModal() {
            isEditing = false;
            modalTitle.textContent = 'Add New Note';
            noteForm.reset();
            noteModal.style.display = 'flex';
            document.getElementById('noteTitle').focus();
        }

        // Open modal for editing an existing note
        function openEditModal(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;
            
            isEditing = true;
            currentNoteId = noteId;
            modalTitle.textContent = 'Edit Note';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('noteCategory').value = note.category;
            document.getElementById('noteTags').value = note.tags.join(', ');
            noteModal.style.display = 'flex';
        }

        // Close the note modal
        function closeNoteModal() {
            noteModal.style.display = 'none';
            isEditing = false;
            currentNoteId = null;
        }

        // Handle form submission
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            const category = document.getElementById('noteCategory').value;
            const tags = document.getElementById('noteTags').value
                .split(',')
                .map(tag => tag.trim())
                .filter(tag => tag !== '');
            
            if (!title) {
                alert('Please enter a title for your note');
                return;
            }
            
            if (isEditing) {
                // Update existing note
                const noteIndex = notes.findIndex(n => n.id === currentNoteId);
                if (noteIndex !== -1) {
                    notes[noteIndex] = {
                        ...notes[noteIndex],
                        title,
                        content,
                        category,
                        tags,
                        date: new Date().toISOString().split('T')[0]
                    };
                }
            } else {
                // Add new note
                const newNote = {
                    id: notes.length > 0 ? Math.max(...notes.map(n => n.id)) + 1 : 1,
                    title,
                    content,
                    category,
                    tags,
                    date: new Date().toISOString().split('T')[0]
                };
                notes.unshift(newNote);
            }
            
            renderNotes();
            closeNoteModal();
        }

        // Delete a note
        function deleteNote(noteId) {
            if (confirm('Are you sure you want to delete this note?')) {
                notes = notes.filter(note => note.id !== noteId);
                renderNotes();
            }
        }

        // Toggle between light and dark mode
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = themeToggle.querySelector('i');
            if (document.body.classList.contains('dark-mode')) {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        // Handle search input
        function handleSearch() {
            currentSearch = searchInput.value;
            renderNotes();
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
